[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-router"
version = "1.0.0"
description = "Declarative, automated file routing engine for macOS"
readme = "README.md"
authors = [{ name = "Rick", email = "rick08274@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
file-router = "router:main"
